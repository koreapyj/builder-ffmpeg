name: Build jellyfin-ffmpeg

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distro }}/${{ matrix.codename }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian bullseye
          - distro: debian
            codename: bullseye
            arch: amd64
          - distro: debian
            codename: bullseye
            arch: arm64
          # Debian bookworm
          - distro: debian
            codename: bookworm
            arch: amd64
          - distro: debian
            codename: bookworm
            arch: arm64
          # Debian trixie
          - distro: debian
            codename: trixie
            arch: amd64
          - distro: debian
            codename: trixie
            arch: arm64
          # Ubuntu jammy
          - distro: ubuntu
            codename: jammy
            arch: amd64
          - distro: ubuntu
            codename: jammy
            arch: arm64
          # Ubuntu noble
          - distro: ubuntu
            codename: noble
            arch: amd64
          - distro: ubuntu
            codename: noble
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Clone jellyfin-ffmpeg
        run: |
          # Local release tags are "<upstream>+<local>" (e.g. v7.1.3-6+1231).
          # Strip the local "+..." suffix to get the upstream jellyfin tag to build.
          tag="${{ github.ref_name }}"
          upstream="${tag%%+*}"
          echo "Release tag '$tag' -> cloning upstream jellyfin-ffmpeg '$upstream'"
          git clone --depth 1 --branch "$upstream" \
            https://github.com/jellyfin/jellyfin-ffmpeg.git jellyfin-ffmpeg

      - name: Apply patches
        run: |
          set -eu
          # build/packaging patches -> git-applied to the checkout before the build
          # runs (docker-build.sh must already carry them when it executes).
          for patch in patches/*.patch; do
            [ -e "$patch" ] || continue
            git -C jellyfin-ffmpeg apply "../$patch"
          done
          # ffmpeg-source patches -> appended to jellyfin's debian/patches/series so
          # both build paths apply them LAST, on top of jellyfin's source patches
          # (Linux: dpkg-source --before-build; Win64: quilt push over the symlink).
          for patch in source-patches/*.patch; do
            [ -e "$patch" ] || continue
            cp "$patch" jellyfin-ffmpeg/debian/patches/
            basename "$patch" >> jellyfin-ffmpeg/debian/patches/series
          done

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make mmv

      - name: Build
        working-directory: jellyfin-ffmpeg
        run: ./build ${{ matrix.codename }} ${{ matrix.arch }} dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-${{ matrix.codename }}-${{ matrix.arch }}
          path: jellyfin-ffmpeg/dist/
          retention-days: 30
          if-no-files-found: error

  build-windows:
    name: windows/win64
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Clone jellyfin-ffmpeg
        run: |
          # Local release tags are "<upstream>+<local>" (e.g. v7.1.3-6+1231).
          # Strip the local "+..." suffix to get the upstream jellyfin tag to build.
          tag="${{ github.ref_name }}"
          upstream="${tag%%+*}"
          echo "Release tag '$tag' -> cloning upstream jellyfin-ffmpeg '$upstream'"
          git clone --depth 1 --branch "$upstream" \
            https://github.com/jellyfin/jellyfin-ffmpeg.git jellyfin-ffmpeg

      - name: Apply patches
        run: |
          set -eu
          # build/packaging patches -> git-applied to the checkout before the build
          # runs (docker-build.sh must already carry them when it executes).
          for patch in patches/*.patch; do
            [ -e "$patch" ] || continue
            git -C jellyfin-ffmpeg apply "../$patch"
          done
          # ffmpeg-source patches -> appended to jellyfin's debian/patches/series so
          # both build paths apply them LAST, on top of jellyfin's source patches
          # (Linux: dpkg-source --before-build; Win64: quilt push over the symlink).
          for patch in source-patches/*.patch; do
            [ -e "$patch" ] || continue
            cp "$patch" jellyfin-ffmpeg/debian/patches/
            basename "$patch" >> jellyfin-ffmpeg/debian/patches/series
          done

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Build
        working-directory: jellyfin-ffmpeg
        run: ./build-windows-win64 dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-win64
          path: jellyfin-ffmpeg/dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
